glossary:

  - term: access permissions
    cat: Computing Skills
    definition: Access permissions determine who can read, write, or execute a file or directory, controlling user and group access within the HPC environment.
    related: [file system, user, group, security]

  - term: algorithm
    cat: Computing Skills
    definition: A set of rules in problem-solving operations. Creating algorithms is a foundation of programming, where a developer defines a finite sequence of well-defined instructions to perform computations and process data. Among the typical elements of an algorithm, regardless of programming language, are conditionals and loops that enable repetitive actions and logical decisions.
    related: [Bash scripting, programming, problem-solving]

  - term: alias
    cat: Computing Skills
    definition: An alias is a shortcut command that maps a custom name to a longer or more complex command, helping users simplify and speed up their work in the command line.
    related: [command line, shell, Bash, environment variables]

  - term: artificial intelligence
    cat: Data Science
    definition: A branch of Computer Science dealing with cognitive technology and simulation of intelligent behavior, including planning, learning, reasoning, problem-solving, knowledge representation, perception, motion, and manipulation.
    related: [data science, machine learning, big data]

  - term: Bash
    cat: Data Science
    definition: A command language in the Unix shell that allows users to execute various processes by writing text commands in the terminal window.
    related: [Unix shell, terminal, command line]
    att: language


  - term: big data
    cat: Data Science
    definition: focuses on the large size of data, its variety, and the velocity of generating and processing. These parameters continually expand and become a bottleneck on existing computational approaches. It also integrates modern (i) analytical techniques (e.g., machine learning), (ii) technologies (e.g., distributed computing), and (iii) visualization solutions (e.g., interactive graphing and infographics), applied during the life cycle of Big Data.
    related: [digital data, structured data, unstructured data, data science]

  - term: binary
    cat: Data Science
    definition: A numbering system where data is expressed in the base-2. It is a mathematical expression which uses only two symbols, typically 0 and 1 to represent data.


  - term: CLI environment
    cat: Computing Skills
    definition: A CLI environment serves as a system-wide configuration, providing a command interpreter that processes user inputs, along with environment variables, system utilities, and scripting support for managing tasks and processes.
    related: [command line interface, Unix shell]

  - term: code
    cat: Computing Skills
    definition: in programming is a set of instructions for the computer. Code is written using programming language(s) and can be used to run a process, task, software, system, etc. on a computer.
    related: [programming]

  - term: command line
    cat: Computing Skills
    definition: The actual line where commands are typed within the CLI. It represents the input area (usually a single line) where a user enters text commands.
    related: [Unix shell, terminal, Bash]

  - term: command line interface
    cat: Computing Skills
    definition: A user interface that allows users to interact with a computer system by typing text commands rather than using a graphical interface (GUI). Provides a method to execute programs, manage files or perform system tasks by entering commands.
    related: [Unix shell, terminal, Bash]
    alt: CLI
    compile: [command line, command, CLI environment]

  - term: command
    cat: Computing Skills
    definition: A command is a text-based instruction given to a computer through the Command Line Interface (CLI) to perform a specific task, such as running a program, managing files or processing data. Commands trigger the execution of various processes.
    related: [Unix shell, terminal, Bash, command line]

  - term: Conda
    cat: Computing Skills
    definition: An open-source package and environment manager used to install, update, and manage bioinformatics software reproducibly.
    related: [environment file, module system]

  - term: container
    cat: [Computing Skills, Bioinformatics]
    definition: An executable package of specific application code and its dependencies, bundled together into a consistent, portable environment. This eliminates the need for users to install or configure software manually and ensures that tools in compatible versions run reliably across different systems.  
    related: [programming]

  - term: data science
    cat: Data Science
    definition: A modern conception of efficient computational processing of large sets of digital information for data mining and knowledge discovery. Data Science focuses on solving various technical challenges related to Big Data and developing innovative techniques unique to digital data (e.g., Machine Learning). It is a highly interdisciplinary field using the latest developments in Computer & Information Science, also strongly supported by Mathematics and Statistics, and complemented by specific Domain Knowledge.
    related: [big data, machine learning, knowledge]

  - term: data wrangling
    cat: Data Science
    definition: is the process of transforming raw data into a usable format according to your project's requirements.


  - term: development environment
    cat: Computing Skills
    definition: A software with the interface for developers where they create and modify the source code of their application (software, pipeline, analysis). Examples include VS Code or PyCharm.
    alt: DE

  - term: digital data
    cat: Data Science
    definition: A collection of observables registered in a computer-readable representation. A single item of data is called a datum. Each datum has assigned the binary value of “false, 0” or “true, 1”, resulting in a bit of information, i.e., one binary digit.
    related: [structured data, unstructured data, big data]

  - term: directory
    cat: Computing Skills
    definition: A directory is a location in the file system used to organize and store files or other directories. It functions like a folder that helps structure data within the HPC environment.
    related: [file system, path, home directory]

  - term: directory tree
    cat: Computing Skills
    definition: "A hierarchical structure that organizes files and folders on a computer system, starting from a root directory and branching into subdirectories. A project directory tree provides a logical layout for project data, scripts, results, and documentation, making it easier to navigate, manage versions, and maintain reproducibility."
    related: [project directory, documentation, README]

  - term: distributed computing
    cat: Computing Skills
    definition: A system of multiple computer machines connected over a network to create a computing cluster that appears as a single computer to the end-user. It provides a unified environment with access to shared resources (software, data, storage) and coordinated computing power. Distributed computing is a technique typically used in the High-Performance Computing (HPC) infrastructures.
    related: [queue, job scheduler, high-performance computing, HPC]

  - term: documentation
    cat: Computing Skills
    definition: The systematic recording of information about research processes, methods, data, and results. In a research context, documentation ensures transparency, reproducibility, and long-term usability of scientific work. In HPC projects, a README file is often used as the primary form of documentation.
    related: [queue, job scheduler, high-performance computing, HPC]

  - term: environment
    cat: Computing Skills
    compile: [development environment, programming environment, CLI environment]

  - term: environment file
    cat: Computing Skills
    definition: A configuration file listing software packages and versions required to reproduce a specific computational environment.
    related: [Conda, module system]

  - term: file system
    cat: Computing Skills
    definition: is the organization of data retained in the digital storage on the computing machine. The content consists of hierarchically ordered folders and files. Folders are user-categorized containers for files. Files contain data and consume digital storage space. Some files belong to the operating system and include configurations, source code, and executables of various programs. Each file and folder is assigned an absolute path that defines its location in the file system. Knowing this path is very useful for navigating the file system from the command line.
    related: [operating system, command line, Bash scripting]

  - term: Git repository
    cat: Computing Skills
    definition: A storage space where code, documents, and version history are tracked and managed with Git, supporting collaboration and reproducibility.
    related: [metadata, project directory]

  - term: Gnuplot
    cat: Data Science
    definition: A free program that can generate two- and three-dimensional plots of functions, data, and data fits. It works as both command-line and GUI interface. You can export graphic files in a variety of formats (SVG, PNG, etc.) or analyze the results interactively, customizing the graph as you wish.
    related: [data analysis, Bash scripting, interactive graphing]

  - term: GUI
    cat: Data Science
    definition: short for Graphical User Interface, is an interface through which users interact with computers and other electronic devices using icons and other visual elements.


  - term: home directory
    cat: Computing Skills
    definition: The home directory is a user's personal storage space on the HPC system, intended for individual files, scripts, and configurations.
    related: [directory, file system, user workspace]

  - term: HPC
    cat: Computing Skills
    definition: High-Performance Computing, is to perform computations requiring high computational power not available from a single computer. HPC operates on a dedicated infrastructure in the framework of distributed computing that aggregates computer power in networks, such as computer clusters, supercomputers, and cloud-based services.
    related: [distributed computing, queue, big data]

  - term: HTML
    cat: Data Science
    definition: HyperText Markup Language is the standard language for webpages. HTML is used to display the contents of a website on a web browser.


  - term: IDE
    cat: Computing Skills
    definition: Integrated Development Environment is an application for software development that includes a code editor, debugging tools, and version control system. IDE software (RStudio, JupyterLab) are designed to make the process of writing, testing, and debugging code easier and more efficient.


  - term: information
    cat: Data Science
    definition: A meaningful and organized product of data processing. It maintains data compression, encapsulates densification of value and veracity, and provides context for querying in the analysis.
    related: [digital data, big data, raw data, knowledge]

  - term: interactive graphing
    cat: Data Science
    definition: A method for data visualization that enables users to interact with the data on-the-fly, see the details such as numerical values, and freely customize the final plot. That is a modern approach that gives greater insight into the dataset and allows for collaborative work on data analysis.
    related: [visualization, big data, knowledge]

  - term: JupyterLab
    cat: Computing Skills
    definition: An integrated development environment (IDE) with an interactive web-based computing interface that supports programming in multiple languages, including Python, Java, R, Julia, Matlab, Octave, etc. The Jupyter interface has a form of a notebook, where you can do it all at once, (i) develop and execute code cells, (ii) write comments and documentation in markdown, and (iii) visualize and analyze results with an interactive graphing.
    related: [programming, environment, IDE, Python, interactive graphing]

  - term: kernel
    cat: Computing Skills
    definition: in computing is the core of the operating system. It is the system that connects the hardware with the software. Kernel is responsible for management of memory, tasks, and processes.
    related: [operating system]

  - term: knowledge
    cat: Data Science
    definition: An extracted non-trivial insight from the data classification and analysis of information. Knowledge, while applied, leads to problem-solving, improvements, and steady development.
    related: [digital data, big data, raw data, information]

  - term: library
    cat: Computing Skills
    definition: a collection of prewritten code. Programming libraries are made to be used for common tasks, for example, Numpy in Python is used for working with huge arrays of data.
    related: [programming]

  - term: Linux
    cat: Computing Skills
    definition: A family of operating systems that includes Ubuntu, Debian, Fedora, etc. These are open-source operating systems based on the Linux kernel.


  - term: local machine
    cat: Computing Skills
    definition: is the computer that the user is using with direct access to it. Usually, it is your personal computer. A local machine can be used to access the remote supercomputer.
    related: [distributed computing, HPC, remote machine]

  - term: loop
    cat: Computing Skills
    definition: A set of code that is written in such a way that it performs a task repetitively until a condition is met.
    related: [programming]

  - term: machine learning
    cat: Data Science
    definition: A field of study focused on developing advanced computer algorithms that search for deeply coupled patterns in massive, disparate data and enable knowledge extraction. Machine learning methods are trained with large sets of data, and they learn from examples to make intelligent decisions without being explicitly programmed.
    related: [big data, unstructured data, data science, artificial intelligence]

  - term: metadata
    cat: Data Science
    definition: Descriptive information about data (such as origin, format, or parameters) that provides context and supports reproducibility.
    related: [project directory, environment file]

  - term: module
    cat: Computing Skills
    definition: A small piece of a larger program. Modular programming is a way to design software such that each module is independent and can be used to execute a part of the function.
    related: [programming]
    compile: [module system]

  - term: module system
    cat: Computing Skills
    definition: A system that allows users to dynamically load, unload, and manage software packages on HPC.
    related: [Conda, environment file]

  - term: Nextflow
    cat: Data Science
    definition: A domain specific language used for bioinformatics data analysis. It uses software containers and enables reproducible scientific workflows.
    related: [programming]

  - term: node (hpc)
    cat: Computing Skills
    definition: A unit in an HPC cluster. It can be a single computer or a server in a collection that makes the cluster.


  - term: Open OnDemand
    cat: Computing Skills  
    definition: Open OnDemand is a web-based interface that provides users with easy access to HPC resources without requiring command-line interaction. It allows users to manage files, submit and monitor jobs, and launch interactive applications such as JupyterLab or RStudio directly from a web browser.  
    related: [HPC, web portal, JupyterLab, RStudio, file management]
    alt: OOD

  - term: operating system
    cat: Computing Skills
    definition: OS, is the core software on the computer that manages computing resources, performes installations, and executes available programs. Command-line interface (CLI) and Graphical User Interface (GUI) enable the user directly interact with the operating system to set up, configure, and troubleshoot it. Among the popular operating systems are Windows, Mac OS, and Linux.
    related: [command line, Bash shell, programming]

  - term: path
    cat: Computing Skills
    definition: A path specifies the location of a file or directory within the file system, showing how to navigate to it from the root or current directory.
    related: [directory, file system, command line]

  - term: prompt
    cat: Computing Skills 
    definition: In the command line, a prompt is the text displayed before the cursor, indicating that the system is ready to receive user input (e.g., <code>user@hostname:~$</code> in Linux or <code>C:\Users\Name></code> in Windows).
    related: [command line, command]

  - term: programming
    cat: Computing Skills
    definition: means creating a set of instructions for a computer on how to execute operations in order, following the assumptions and logical conditions of the algorithm. Many programming languages facilitate communication between the code developer and the computing machine. Bash enables a shell scripting using a command-line interpreter for automating repetitive tasks by executing pre-defined commands according to requested conditionals and loops. More advanced analytical operations, including mathematical and statistical functions, modifying complex data structures, or processing non-text data, usually require a higher-level programming language such as Python or C++.
    related: [algorithm, command line, Bash, Python, R, C++]

  - term: programming environment
    cat: Computing Skills
    definition: A layer of settings specific for a given programming language or type of developed application. It can be isolated from the general operating system and provides a kind of virtual environment with adjusted software configuration or modules loaded in a selected release. Virtual environments are commonly used when programming in Python and can be easily created using Conda (environment management system). 


  - term: project directory
    cat: Computing Skills
    definition: "A structured workspace on SCINet supercomputers containing data, scripts, results, and documentation, usually associated with ARS Research Projects. After being added to the project group, users are able to access <b>/project/</b>project_name, <b>/90daydata/</b>project_name on Atlas and Ceres, and <b>/LTS/project/</b>project_name on Juno archive storage."
    related: [scratch space, metadata]

  - term: pseudocode
    cat: Computing Skills
    definition: A representation of code or algorithm, summarizing the code. It is a readable step by step description of what the program should do.
    related: [programming]

  - term: purge policy
    cat: Computing Skills
    definition: A purge policy defines how and when files are automatically deleted from certain storage areas, such as temporary or scratch spaces, to manage disk usage and maintain system performance. On SCINet supercomputers the 90 day purge policy is set for <b>/90daydata/</b> path.
    related: [storage, scratch space]

  - term: queue
    cat: Computing Skills
    definition: in distributed computing, it is an organized list (sequence) of tasks submitted to the job scheduler that manages the computational resources and decides to start or stop the task. The queue is ordered by wait time, user priority, and availability of requested resources. When the combination of these factors is advantageous, the submitted task begins executing, and so its status changes from waiting to running. The queuing system is typical for distributed computing, such as a network of computer clusters shared by more users. Some of the most popular workload managers are SLURM and PBS.
    related: [HPC, distributed computing, SLURM, PBS]

  - term: quota
    cat: Computing Skills
    definition: A <a href="https://scinet.usda.gov/guides/data/storage#quotas" target="_blank">storage limit</a> set by the HPC system, defining how much space a user or group can use.
    related: [scratch space, project directory]

  - term: raw data
    cat: Data Science
    definition: is the data captured from the source and has not been processed before the use. It usually has a large volume and serves as a primary unfiltered input in Data Science.
    related: [digital data, big data, data science]

  - term: remote machine
    cat: Computing Skills
    definition: Any other computer or computing network that the user can access by logging into the external network. Performing actions on a remote machine requires a secure login and often requires the user to have an account created by the network administrator. In scientific projects, we use remote computing machines as part of the HPC infrastructure to access high-performance computing and collaboratively share big data.
    related: [distributed computing, HPC, local machine]

  - term: README
    cat: Computing Skills
    definition: A plain-text or markdown file placed in a directory that explains the contents, purpose, and usage of the files within it. A README is often included at the project or pipeline workspace level (and ideally in subfolders) to provide quick guidance and context for anyone accessing the directory.
    related: [project directory, workspace, README]

  - term: reproducibility
    cat: Computing Skills
    definition: The ability to repeat an analysis and obtain the same results, critical for robust scientific workflows.


  - term: SCINet supercomputers
    cat: Computing Skills
    definition: Powerful computing infrastructure used to process large datasets efficiently, often required in modern research. This infrastructure provides two supercomputers (Atlas, Ceres) and Juno (archive storage).


  - term: scratch space
    cat: Computing Skills
    definition: High-performance temporary storage on an HPC system, intended for active computations and subject to automatic purging. <i>See <a href="https://scinet.usda.gov/guides/data/storage#temporary-local-node-storage" target="_blank">Temporary Local Node Storage</a> guide for SCINet users.</i>
    related: [quota, project directory]

  - term: shared space
    cat: Computing Skills
    definition: "Shared space is a storage area on the HPC system accessible by multiple users, typically used for collaboration and shared project data. On SCINet, shared spaces include /90daydata/shared for collaboration and centrally managed /reference/ location with pre-downloaded data/ and containers/."
    related: [project directory, access permissions, collaboration]

  - term: shell
    cat: Computing Skills
    definition: A command interpreter that processes user commands and passes them to the operating system. Provides users with the ability to execute commands, run scripts, and manage processes and files in the systems.


  - term: SLURM
    cat: Computing Skills
    definition: Simple Linux Utility for Resource Management - a cluster management and job scheduling system. It is used in management of the HPC cluster environments.
    related: [distributed computing, HPC]
    alt: SLURM workload manager

  - term: standard out
    cat: Computing Skills
    definition: The text result of a command


  - term: storage
    cat: Computing Skills
    definition: Storage is the capacity and infrastructure used to hold data on the HPC system. It includes various spaces, such as /home, /project, and temporary areas (e.g., /90daydata/), each designed for specific types of data and usage needs.
    related: [file system, directory, project directory, home directory]

  - term: structured data
    cat: Data Science
    definition: is highly organized in terms of easy digital deciphering. That includes a standardized format, enduring order, and categorization in a well-determined arrangement that facilitates managing and querying datasets in various combinations. A typical example of an organized data structure is a spreadsheet or relational database.
    related: [digital data, unstructured data, big data]

  - term: supercomputer
    cat: Data Science
    definition: or a computer cluster is a group of computing machines or servers that work together as a single system. Clusters provide high performance computing and parallel processing by distribution of tasks across multiple machines.
    related: [distributed computing, big data]

  - term: terminal
    cat: Computing Skills
    definition: A program for accessing files on your computer using the command line.
    related: [command line, Unix shell, Bash]

  - term: Unix shell
    cat: Computing Skills
    definition: A command-line interpreter that provides a command-line user interface for a computer's operating system (OS). The OS uses shell scripts/commands to control the execution of the programs and procedures.
    related: [command line, terminal, Bash]

  - term: unstructured data
    cat: Data Science
    definition: has no organized structure that can be easily detected, processed, and categorized by computer algorithms. This type of data is usually massive and descriptive in nature. A good example is the streams of highly varied text (e.g., emails, social media posts, online blogs, newspapers, books, and scientific publications), audio and video recording, images and photos, data from various sensors (weather, traffic), and medical records.
    related: [digital data, structured data, big data]

  - term: virtual environment
    cat: Computing Skills
    definition: A virtual environment is an isolated workspace that allows users to manage specific software packages and dependencies without affecting the system-wide configuration.
    related: [Python, software environment, modules, containers]

  - term: visualization
    cat: Data Science
    definition: A highly visually influential and semantically meaningful form of modern communication methods. In Data Science, interactive graphing and creating concise infographics support both the ease of extracting insights and the opportunity for deeper analysis for those interested. That contributes to better knowledge retention.
    related: [data analysis, knowledge, interactive graphing]

  - term: web browser
    cat: Data Science
    definition: An application used to access internet and browse websites and web pages. You can use web browser to access SCINet supercomputers via Open OnDemand interface.

  - term: welcome message
    cat: Computing Skills
    definition: The startup message when logging into a remote machine. It displays information about the architecture of available resources and rules for the users.

  - term: workdir
    cat: Computing Skills
    definition: A working directory for a project or computational task. It often appears as a variable or instruction that can be assigned a path to a selected location in the file system. That path is then used for all future commands that require a location, such as writing to a file. It is a common variable for workload managers on distributed computing infrastructures. The pathname of the current working directory can be accessed with the 'pwd' command or using the '$PWD' environmental variable.
    related: [HPC, command line]

  - term: working directory
    cat: Computing Skills
    definition: "A working directory is the <b>active location</b> (usually within a workspace) where computations are executed and outputs are written during a run."
    related: [HPC, command line]

  - term: workspace
    cat: Computing Skills
    definition: "A workspace is a <b>directory tree</b> created by a user to organize input data, scripts, intermediate files, and results for a specific analysis, pipeline, or computational task."
    related: [HPC, command line]

## Bioinformatics

  - term: aligned reads
    cat: Bioinformatics
    definition: Sequencing reads that have been mapped to a reference genome, with positions and alignment quality recorded in formats like SAM/BAM/CRAM.  
    related: [sequencing technologioes, alignment]

  - term: alignment
    cat: Bioinformatics
    definition: |
      in Bioinformatics, means finding matching fragments in compared sequences of biopolymers (DNA, RNA, proteins, peptides). Each sequence is represented as a string of letters corresponding to the monomer types (4-letter alphabet for nucleic acids and 20-letter alphabet for polypeptides), following their order in the molecule. All sequences aligned must be converted to the same 1-letter notation (either nucleotide or amino acid). The sequences are written horizontally in rows, and empty positions (gaps) are inserted between the letters so that the following columns contain identical or similar characters. The final pattern of matching data positions is called a sequence alignment.  

      **The variations of sequence alignment facilitate many bioinformatics tasks, such as:** 
        * Proteomics - identification of functional, structural, or evolutionary relationships between proteins based on the similarity of the sequences (see <a href='/glossary#multiple-sequence-alignment'>Multiple Sequence Alignment</a>)
        * Genetics - investigating the single-nucleotide polymorphism at a specific position in the genome or population (see <a href='/glossary#msa-for-snp'>MSA for SNP</a>)
        * Transcriptomics - investigating gene expression based on the sequenced RNA (see <a href='/glossary#transcriptome-assembly'>Transcriptome Assembly</a>)
        * Transcriptomics - identyfication of genes location in the reference genome based on the sequenced RNA (see <a href='/glossary#genome-guided-assembly'>Genome-guided Assembly</a>)
        * Genomics - reconstructing the genome based on the sequenced DNA fragments
    alt: sequence alignment

  - term: alternative splicing
    cat: Bioinformatics
    definition: is the process (* natural in vivo in eukaryotes) of assembling various messenger RNAs (mRNA) from a pool of exons encoded by a single DNA gene. That allows significant compression of genetic material because a single gene code for multiple products, such as protein variants (isoforms) and functional non-coding RNA. The most common mechanism for creating truncated mRNA alternatives is (selected) exon(s) skipping.
    related: [gene expression, transcriptome, messenger RNA]
    alt: differential RNA splicing
    wiki: https://en.wikipedia.org/wiki/Alternative_splicing


  - term: annotation
    cat: Bioinformatics
    definition: The process of identifying and labeling functional elements in a genome or transcriptome, such as genes, exons, or regulatory regions.


  - term: assembly
    cat: Bioinformatics
    definition: The computational reconstruction of longer sequences (contigs or scaffolds) from shorter sequencing reads.
    related: [genome assembly, transcriptome assembly]

  - term: base
    cat: Bioinformatics
    definition: "A single nucleotide unit: adenine (A), cytosine (C), guanine (G) and thymine (T) in a DNA strand or uracil (U) in RNA molecule. Bases are the fundamental building blocks of nucleotide sequences."
    related: [DNA, RNA, nucleotide sequence]

  - term: bioinformatics
    cat: Bioinformatics
    definition: "Bioinformatics applies computational methods to manage, analyze, and interpret biological data. <b>Sequence Bioinformatics</b> involves processing and analysis of large-scale DNA, RNA, and protein sequences generated from high-throughput technologies to enable biological interpretation. Typical tasks include sequence alignment, motif discovery, gene prediction, variant calling, phylogenetic analysis, the annotation of genomes and transcriptomes, and expression quantification."
    related: [RNA-seq, sequencing technologies, big data]

  - term: biological sample
    cat: Bioinformatics
    definition: A source of genetic material (e.g., tissue, cells, soil) from which DNA or RNA is extracted for sequencing.
    related: [DNA, RNA]

  - term: biological sequences
    cat: Bioinformatics
    definition: Linear representations of DNA, RNA, or protein molecules that carry genetic or functional information.
    related: [DNA, RNA, protein]

  - term: chromosome
    cat: Bioinformatics
    definition: A long DNA molecule containing part or all of the genetic material of an organism, often organized into linear or circular structures.
    related: [DNA, gene, genome]

  - term: contig
    cat: Bioinformatics
    definition: A continuous DNA sequence assembled from overlapping sequencing reads, without gaps. Contigs often represent only partial regions of the genome. 
    related: [read, scaffold, RNA-seq]

  - term: coverage
    cat: Bioinformatics
    definition: The average number of times each base in the genome is sequenced; higher coverage increases data accuracy and variant detection power.
    related: [read, scaffold, RNA-seq]

  - term: data formats
    cat: Bioinformatics
    definition: Standardized ways of storing and organizing biological data to facilitate analysis and interoperability.
    related: []

  - term: differential expression
    cat: Bioinformatics
    definition: A comparison of gene expression levels between samples or conditions to identify genes with statistically significant changes.
    related: [gene expression, transcriptome, RNA-seq]
    wiki: https://en.wikipedia.org/wiki/RNA-Seq#Differential_expression


  - term: DNA
    cat: Bioinformatics
    definition: <i>(Deoxyribonucleic Acid)</i> The molecule that carries genetic instructions in all living organisms and many viruses. DNA sequences are composed of A, G, C, T nucleotide bases.
    related: [base, nucleotide sequence, gene]

  - term: exon
    cat: Bioinformatics
    definition: A segment of a gene that remains in the mature RNA transcript after splicing and typically encodes protein.
    related: [gene expression, alternative splicing]
    wiki: https://en.wikipedia.org/wiki/Exon


  - term: feature
    cat: Bioinformatics
    definition: A genomic element described in annotation files (e.g., gene, transcript, exon, regulatory region), defined by genomic coordinates and additional metadata.  
    related: [gene, exon, genomic coordinates, annotation]

  - term: file compression
    cat: Bioinformatics
    definition: Reducing file size using algorithms (e.g., gzip), often essential for handling large sequencing datasets. 


  - term: file extension
    cat: Bioinformatics
    definition: The suffix of a file name that indicates its format (e.g., .fastq, .fa, .bam).


  - term: gene
    cat: Bioinformatics
    definition: A region of DNA that encodes a functional product, usually a protein or functional RNA.
    related: [DNA, gene expression, chromosome]

  - term: gene expression
    cat: Bioinformatics
    definition: "The biological process by which information from a gene is used to produce RNA and, often, a protein product. <br>
      In bioinformatics, gene expressionis is quantified as the amount of RNA transcribed from each gene. It is analyzed using sequencing data (e.g., RNA-seq) to determine when, where, and to what extent genes are active under specific biological conditions."

    related: [sequencing technologies, RNA-seq, transcriptome]

  - term: genome assembly
    cat: Bioinformatics
    definition: The reconstruction of the complete DNA sequence of an organism's genome from sequencing reads.
    related: [sequencing technologies, read, DNA]

  - term: genome index
    cat: Bioinformatics
    definition: A data structure of a compressed full-text file containing the reference genome (e.g., .fna file). Using the genome index makes it efficient when searching a substring (e.g., matching reads) in a large text. Programs such as HISAT2 (hisat2-build indexer) build the reference genome index using the FM-index approach, where the data is both compressed and indexed to reasonably fit within a computer's memory.
    related: [RNA-seq, transcriptome assembly, mapping, alignment, sequencing technologies]

  - term: genomic coordinates
    cat: Bioinformatics
    definition: The precise location of a feature on a reference genome, defined by chromosome/contig name, start, and end positions (e.g., chr1:11869-12227).  
    related: [feature, genomic reference, sequencing technologies]

  - term: genomic reference
    cat: Bioinformatics
    definition: A curated and standardized representation of an organism's genome used for read alignment and variant analysis.
    related: [RNA-seq, genome-guided alignment, transcriptome assembly]
    alt: reference genome
    wiki: https://en.wikipedia.org/wiki/Reference_genome


  - term: high-throughput sequencing
    cat: Bioinformatics
    definition: Modern (experimental) sequencing technologies that generate massive volumes of sequence data quickly and cost-effectively.
    related: [DNA, sequencing technologies]

  - term: intron
    cat: Bioinformatics
    definition: A non-coding segment of a gene that is removed from the RNA transcript during splicing.
    related: [exon, gene, gene expression]
    wiki: https://en.wikipedia.org/wiki/Intron


  - term: isoform
    cat: Bioinformatics
    definition: An alternative version of a transcript produced from the same gene via alternative splicing or different transcription start sites.
    related: [alternative splicing, gene expression, messenger RNA]
    alt: transcript
    wiki: https://en.wikipedia.org/wiki/Protein_isoform


  - term: locus
    cat: Bioinformatics
    definition: A known, fixed position on a chromosome where a specific gene or genetic marker is located.
    related: [chromosome, gene, DNA]

  - term: mapping
    cat: Bioinformatics
    definition: in RNA-seq analysis, means detecting the presence and location (position) of individual reads (fragments of a sequence obtained from sequencing experiment) within the sequence space of a reference genome. In particular, sequenced RNA can be mapped to the reference genome to identify genes and get information about gene expression.
    related: [RNA-seq, reads alignment, gene expression]
    alt: sequencing reads to reference genome

  - term: multiple sequence alignment
    cat: Bioinformatics
    definition: A computational alignment of three or more biological sequences (DNA, RNA, or protein) to identify regions of similarity.
    related: [sequence alignment, evolutionary insights, SNP (polymorphism)]
    alt: MSA

  - term: multiplexing
    cat: Bioinformatics
    definition: A technique that allows multiple samples to be sequenced in a single run by adding unique barcode sequences to each sample.
    related: [RNA-seq, sequencing technologies, optimization]
    alt: multiplexed sequencing
    tutorial: Tutorial


  - term: nuclotide
    cat: Bioinformatics
    definition: Nuclotide
    related: [DNA, RNA, nuclotide sequence]
    alt: base

  - term: nucleotide sequence
    cat: Bioinformatics
    definition: An ordered string of nucleotide bases (A, T, C, G for DNA; A, U, C, G for RNA) that represents the genetic information of an organism.
    related: [DNA, RNA, base]

  - term: platform bias
    cat: Bioinformatics
    definition: Systematic errors or preferences introduced by a sequencing platform, which can affect base calling or representation of certain sequences.
    related: [sequencing technologies, read]


  - term: project organization
    cat: Bioinformatics
    definition: The practice of setting up directories, managing files, and documenting processes for scalable, reproducible analysis.
    related: []

  - term: public databases
    cat: Bioinformatics
    definition: Curated online repositories that store biological sequences, annotations, and related metadata for research use.
    related: []

  - term: quality control
    cat: Bioinformatics
    definition: (<b>QC</b>) The process of assessing and filtering sequencing data (reads) for issues like low-quality bases, contamination, or adapter sequences before analysis.
    related: [RNA-seq, read, FastQC]
    alt: of RNA-seq data

  - term: read
    cat: Bioinformatics
    definition: "A fragment of DNA or RNA sequences generated by a sequencing machine during sequencing experiment and saved in 1-letter per nucleotide base notation to a digital FASTQ file. 
      Due to the huge size of genetic material (~250 million nucleotide in a single chromosome), a typical sequencing experiment requires fragmentation. The superset of selected/filtered fragments of unknown sequences creates the library. During sequencing, library items are encoded, providing a bulk set of reads (i.e., text strings specifying the order of nucleotides in fragments)."

    related: [sequencing technologies, quality control, RNA-seq]
    wiki: https://en.wikipedia.org/wiki/Read_(biology)

    tutorial: "/bioinformatics/resources/nomenclature"

  - term: read length
    cat: Bioinformatics
    definition: |
      The number of base pairs in a single sequencing read; affects alignment, assembly, and resolution of analysis.
      * **short-read** - Sequencing reads typically 50-300 base pairs long, commonly produced by Illumina platforms, offering high accuracy.
      * **long-read** - Sequencing reads that span thousands of bases, produced by platforms like PacBio or Oxford Nanopore, useful for resolving complex genomic regions.
    related: [DNA, read, transcriptome, RNA-seq]

  - term: RNA
    cat: Bioinformatics
    definition: <i>(Ribonucleic Acid)</i> A molecule that plays roles in coding, decoding, regulation, and expression of genes; includes messenger RNA (mRNA) and other types.
    related: [DNA, transcriptome, RNA-seq]

  - term: RNA-seq
    cat: Bioinformatics
    definition: A sequencing-based method to quantify RNA transcripts, allowing measurement of gene expression and transcript diversity.
    related: [gene expression, transcriptome assembly, sequencing technologies]
    alt: RNA seqencing
    wiki: https://en.wikipedia.org/wiki/RNA-Seq
    tutorial: https://bioinformaticsworkbook.org/dataAnalysis/RNA-Seq/RNA-SeqIntro/RNAseq-intro#gsc.tab=0

  - term: RNA-seq library
    cat: Bioinformatics
    definition: A prepared and processed collection of RNA-derived fragments with sequencing adapters, ready for input into a sequencer.
    related: [sequencing technologies, high-throughput sequencing, read]

  - term: sample metadata
    cat: Bioinformatics
    definition: Contextual information about a biological sample (e.g., species, tissue type, treatment condition), critical for downstream analysis and interpretation.
    related: [biological sample, sequencing technologies]

  - term: scaffold
    cat: Bioinformatics
    definition: A higher-order sequence structure that connects and orders contigs using long-range information, with unresolved regions represented by gaps (Ns). It provides orientation and approximate layout of the genome.
    related: [contig, read, RNA-seq]

  - term: sequencing technologies
    cat: Bioinformatics
    definition: The method or platform used to determine the order of nucleotides in DNA or RNA, such as Illumina, PacBio, or Oxford Nanopore.
    related: [high-throughput sequencing, read]

  - term: single-end vs paired-end
    cat: Bioinformatics
    definition: |
      single-end vs paired-end:
      * strand-specific vs unstranded
      * polyA-enriched vs ribosomal RNA-depleted
      * different read lengths

    related: [RNA-seq, read, sequencing technologies]

  - term: soft-clip
    cat: Bioinformatics
    definition: means ignoring the terminal fragments (ends) of the reads that do not match perfectly to the reference genome alignment. This procedure enables higher mapping efficiency and facilitates detecting structural variants. However, this also bears the danger of incorrectly trimming the reads, leading to the misassignment of reads to repetitive regions. 
    related: [RNA-seq, reads mapping, reads trimming]
    alt: of reads
    learn: LINK

  - term: throughput
    cat: Bioinformatics
    definition: The amount of sequencing data a platform can produce in a given run, usually measured in bases or reads per unit time.
    related: [sequencing technologies, high-throughput sequencing]

  - term: transcript
    cat: Bioinformatics
    definition: An RNA molecule produced from a gene through transcription, represented in annotation files (e.g., GTF/GFF3) as a sequence of exons that may encode a protein or function as non-coding RNA.  
    related: [RNA, gene expression]

  - term: transcriptome
    cat: Bioinformatics
    definition: The full set of RNA transcripts (coding and non-coding) expressed in a cell, tissue, or organism at a given time.
    related: [RNA, gene expression, alternative splicing]

  - term: transcriptome assembly
    cat: Bioinformatics
    definition: The reconstruction of transcript sequences from RNA-seq reads, often used when no reference genome is available.
    related: [RNA-seq, gene expression]
    wiki: https://en.wikipedia.org/wiki/RNA-Seq#Transcriptome_assembly
    tutorial: https://bioinformaticsworkbook.org/dataAnalysis/RNA-Seq/RNA-SeqIntro/RNAseq-using-a-genome.html#gsc.tab=0

  - term: Variant
    cat: Bioinformatics
    definition: A difference between a sample's sequence and the reference genome, such as a single nucleotide polymorphism (SNP), insertion, deletion, or structural change, typically stored in VCF/BCF files.  
    related: []

## Geospatial

  - term: spatial interpolation
    cat: Geospatial
    definition: "Using observations of dependent and independent variables to estimate the value of the dependent variable at unobserved independent variable values. For spatial applications, this can be the case of having point observations (i.e., variable observations at known x-y coordinates) and then predicting a gridded map of the variable (i.e., estimating the variable at the remaining x-y cells in the study area)."
    related: [interpolation]

  - term: geostatistics
    cat: Geospatial
    definition: "Statistics focusing on spatial datasets, e.g. treating spatially heterogeneous variables as random variables with covariance structures describing spatial dependence."

  - term: kriging
    cat: Geospatial
    definition: A geostatistical approach for spatial interpolatation. It uses a variogram model fitted to point observations to define spatial dependence.

  - term: variogram
    cat: Geospatial
    definition: A model describing the relationship between variance between values of pairs of points as a function of the spatial distance between those points.

  - term: random forest
    cat: Geospatial
    definition: A machine learning algorithm that uses an ensemble of decision trees.


  - term: GeoCDL
    cat: Geospatial
    definition: A collection of commonly used raster datasets accessible from an API running on SCINet's Ceres cluster

    alt: Geospatial Common Data Library

  - term: raster
    cat: Geospatial
    definition: "A geospatial datatype where data is stored as a grid of regularly sized pixels. Geospatial rasters contain geospatial metadata, which maps each pixel of the raster to a geospatial location on the Earth's surface. Examples of geospatial raster file types include: geotiff (.tif), and netCDF (.nc)."


  - term: vector
    cat: Geospatial
    definition: "A geospatial datatype where data is stored as a collection of points, lines, or polygons. Each coordinate maps to a location on Earth's surface."
    related: [geojson, shapefile]

  - term: CRS
    cat: Geospatial
    definition: A system for defining geospatial coordinates. Also known as a spatial reference system.

    alt: Coordinate Reference System

  - term: parallel processing
    cat: Computing Skills
    definition: Distributing computational tasks among multiple cores. 
    related: [core]

  - term: core
    cat: Computing Skills
    definition: A processor on a central processing unit; a physical or logical component that can execute computational tasks. 
    related: [CLI]

  - term: tile
    cat: Geospatial
    definition: A continuous segment of a raster dataset or multi-dimensional array.
    alt: chunk

  - term: NDVI
    cat: Geospatial
    definition: A quantity derived from the red and near-infrared bands of imagery to detect vegetation. 
    alt: Normalized Difference Vegetation Index

  - term: spatial join
    cat: Geospatial
    definition: Combining two spatial datasets by the relationship between their geometries.

  - term: zonal statistics
    cat: Geospatial
    definition: "Calculating summary statistics, e.g. mean, of cell values from a raster in each region, where regions can be defined by an overlapping polygon feature collection."

  - term: Bash shell
    cat: Computing Skills
    definition: A popular shell environment (command interpreter) available on most Unix-like and HPC systems


  - term: configuration file
    cat: Computing Skills
    definition: Text file like `.bashrc` or `.bash_profile` that define environment variables and other shell settings.
    related: [DE]

  - term: module system
    cat: Computing Skills
    definition: The `module` command used in HPC clusters to load software environments.
